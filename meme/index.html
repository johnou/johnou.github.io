<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpongeBob Time Card Generator</title>

<link href="https://fonts.cdnfonts.com/css/spongeboy" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/spongeboytt1" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/krabby-patty" rel="stylesheet">

<style>
:root {
  --bg:#151515;
  --panel:#242424;
  --panel2:#303030;
  --ink:#fff3bc;
  --accent:#ffda3a;
}
* { box-sizing:border-box; }
body {
  margin:0;
  min-height:100vh;
  background:#151515;
  color:var(--ink);
  font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
header {
  padding:20px;
  text-align:center;
}
h1 {
  margin:0;
  font-family:"Spongeboy";
  color:var(--accent);
  text-shadow:4px 4px 0 #682fb6, 7px 7px 0 #000;
  font-size:clamp(34px,5vw,68px);
}
.wrap {
  width:min(1200px,96vw);
  margin:0 auto 32px;
  display:grid;
  grid-template-columns:360px 1fr;
  gap:18px;
}
@media (max-width:900px) {
  .wrap { grid-template-columns:1fr; }
}
.panel {
  background:linear-gradient(180deg,var(--panel),var(--panel2));
  border:2px solid #444;
  border-radius:18px;
  padding:16px;
  box-shadow:0 18px 40px rgba(0,0,0,.35);
}
label {
  display:block;
  margin:12px 0 6px;
  font-weight:800;
  color:#fff2a8;
}
input, textarea, select, button {
  width:100%;
  border:0;
  border-radius:12px;
  padding:10px 12px;
  font:inherit;
}
textarea {
  min-height:86px;
  resize:vertical;
  font-weight:900;
}
input[type="color"] {
  height:44px;
  padding:4px;
}
input[type="range"] {
  padding:0;
}
.row {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.drop {
  border:3px dashed #777;
  border-radius:18px;
  padding:18px;
  text-align:center;
  background:#191919;
  cursor:pointer;
  transition:.2s;
}
.drop.drag {
  border-color:var(--accent);
  background:#302800;
  transform:scale(1.01);
}
.hint {
  font-size:13px;
  opacity:.75;
  line-height:1.35;
}
button {
  cursor:pointer;
  background:var(--accent);
  color:#241900;
  font-weight:900;
  margin-top:12px;
  box-shadow:0 5px 0 #b58500;
}
button:active {
  transform:translateY(3px);
  box-shadow:0 2px 0 #b58500;
}
.secondary {
  background:#55d6ff;
  box-shadow:0 5px 0 #1688ad;
}
.danger {
  background:#ff73a9;
  box-shadow:0 5px 0 #a82e62;
}
.loadingWrap {
  margin-top:10px;
  background:#111;
  border:1px solid #444;
  border-radius:999px;
  overflow:hidden;
  height:14px;
}
.loadingBar {
  width:0%;
  height:100%;
  background:var(--accent);
  transition:width .18s ease;
}
.loadingText {
  margin-top:6px;
  font-size:12px;
  opacity:.75;
}
.gallery {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:10px;
}
.thumb {
  aspect-ratio:16/9;
  border-radius:10px;
  overflow:hidden;
  border:2px solid rgba(255,255,255,.35);
  background:#111;
  cursor:pointer;
  position:relative;
  padding:0;
  margin:0;
  box-shadow:none;
}
.thumb.active {
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(255,218,58,.25);
}
.thumb img {
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.thumb span {
  position:absolute;
  right:4px;
  bottom:3px;
  background:rgba(0,0,0,.65);
  color:white;
  font-size:10px;
  padding:2px 5px;
  border-radius:999px;
}
.canvasShell {
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  overflow:hidden;
  border-radius:20px;
  border:3px solid #444;
  background:#333;
  box-shadow:inset 0 0 0 4px rgba(255,255,255,.08), 0 18px 40px rgba(0,0,0,.35);
}
canvas {
  width:100%;
  height:100%;
  display:block;
}
.animatedText {
  pointer-events:none;
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  text-align:center;
  padding:5%;
  font-family:"Spongeboy";
  color:transparent;
  white-space:pre-wrap;
  line-height:.94;
  transform-origin:center;
  --anim-duration:1400ms;
  opacity:0;
}
.canvasShell.showAnim .animatedText {
  opacity:1;
}
.animatedText.anim-wobble {
  animation:wobble var(--anim-duration) infinite steps(2,end);
}
.animatedText.anim-bounce {
  animation:bounce var(--anim-duration) infinite ease-in-out;
}
.animatedText.anim-pulse {
  animation:pulseZoom var(--anim-duration) infinite ease-in-out;
}
.animatedText.anim-drift {
  animation:drift var(--anim-duration) infinite ease-in-out;
}
@keyframes wobble {
  0% { transform:rotate(-1.4deg) scale(1.015); }
  50% { transform:rotate(1.2deg) scale(.995); }
  100% { transform:rotate(-1.4deg) scale(1.015); }
}
@keyframes bounce {
  0% { transform:translateY(0) rotate(-0.7deg) scale(1); }
  25% { transform:translateY(-16px) rotate(0.5deg) scale(1.02); }
  50% { transform:translateY(0) rotate(-0.6deg) scale(1); }
  75% { transform:translateY(10px) rotate(0.4deg) scale(.99); }
  100% { transform:translateY(0) rotate(-0.7deg) scale(1); }
}
@keyframes pulseZoom {
  0% { transform:scale(1) rotate(-0.6deg); }
  50% { transform:scale(1.065) rotate(0.6deg); }
  100% { transform:scale(1) rotate(-0.6deg); }
}
@keyframes drift {
  0% { transform:translate3d(-10px,-5px,0) rotate(-0.6deg); }
  25% { transform:translate3d(10px,6px,0) rotate(0.4deg); }
  50% { transform:translate3d(7px,-6px,0) rotate(-0.3deg); }
  75% { transform:translate3d(-8px,8px,0) rotate(0.5deg); }
  100% { transform:translate3d(-10px,-5px,0) rotate(-0.6deg); }
}
.footer {
  opacity:.65;
  font-size:12px;
  text-align:center;
  padding:0 20px 20px;
}
</style>
</head>

<body>
<header>
  <h1>Time Card Generator</h1>
  <p class="hint">Pick a bundled background, drag in extras, type your text, then download a PNG or animated PNG.</p>
</header>

<main class="wrap">
  <section class="panel">
    <div id="drop" class="drop">
      <strong>Drop extra backgrounds here</strong>
      <p class="hint">PNG, JPG, WEBP. You can drop multiple files at once.</p>
      <input id="file" type="file" accept="image/*" multiple hidden>
    </div>

    <div class="loadingWrap" id="loadingWrap">
      <div id="loadingBar" class="loadingBar"></div>
    </div>
    <div id="loadingText" class="loadingText">Loading backgrounds...</div>
    <div id="gallery" class="gallery" aria-label="Backgrounds"></div>

    <label for="text">Time card text</label>
    <textarea id="text">THREE HOURS LATER...</textarea>

    <div class="row">
      <div>
        <label for="font">Font</label>
        <select id="font">
          <option value="Spongeboy" selected>Spongeboy</option>
          <option value="spongeboyTT1">SpongeBoy TT1</option>
          <option value="Krabby Patty">Krabby Patty</option>
        </select>
      </div>
      <div>
        <label for="size">Size</label>
        <input id="size" type="range" min="40" max="180" value="102">
      </div>
    </div>

    <div class="row">
      <div>
        <label for="fill">Text color</label>
        <input id="fill" type="color" value="#f7e56a">
      </div>
      <div>
        <label for="stroke">Outline</label>
        <input id="stroke" type="color" value="#5b2abf">
      </div>
    </div>

    <div class="row">
      <div>
        <label for="shadow">Shadow</label>
        <input id="shadow" type="color" value="#101010">
      </div>
      <div>
        <label for="bgcolor">Fallback bg</label>
        <input id="bgcolor" type="color" value="#e3569f">
      </div>
    </div>

    <div class="row">
      <button id="download">Download PNG</button>
      <button id="randomBack" class="secondary">Back random</button>
    </div>

    <div class="row">
      <button id="randomNext" class="secondary">Next random</button>
    </div>

    <div class="row">
      <div>
        <label for="animStyle">Animation style</label>
        <select id="animStyle">
          <option value="wobble" selected>Wobble</option>
          <option value="bounce">Bounce</option>
          <option value="pulse">Pulse Zoom</option>
          <option value="drift">Drift</option>
        </select>
      </div>
      <div>
        <label for="animSpeed">Animation speed</label>
        <input id="animSpeed" type="range" min="40" max="200" value="100">
      </div>
    </div>

    <button id="toggleAnim" class="secondary">Toggle animation</button>
    <button id="reset" class="danger">Clear selected background</button>
  </section>

  <section>
    <div id="shell" class="canvasShell">
      <canvas id="canvas" width="1920" height="1080"></canvas>
      <div id="animText" class="animatedText"></div>
    </div>
  </section>
</main>

<script src="https://unpkg.com/pako@2.1.0/dist/pako.min.js"></script>
<script src="https://unpkg.com/upng-js@2.1.0/UPNG.js"></script>
<script>
(() => {
  window.addEventListener("error", event => {
    const box = document.getElementById("loadingText");
    if (box) box.textContent = `JS error: ${event.message}`;
    console.error(event.error || event.message);
  });

  window.addEventListener("unhandledrejection", event => {
    const box = document.getElementById("loadingText");
    if (box) box.textContent = `JS promise error: ${event.reason}`;
    console.error(event.reason);
  });

  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const drop = document.getElementById("drop");
  const file = document.getElementById("file");
  const text = document.getElementById("text");
  const font = document.getElementById("font");
  const size = document.getElementById("size");
  const fill = document.getElementById("fill");
  const stroke = document.getElementById("stroke");
  const shadow = document.getElementById("shadow");
  const bgcolor = document.getElementById("bgcolor");
  const download = document.getElementById("download");
  const reset = document.getElementById("reset");
  const shell = document.getElementById("shell");
  const toggleAnim = document.getElementById("toggleAnim");
  const animText = document.getElementById("animText");
  const randomNext = document.getElementById("randomNext");
  const randomBack = document.getElementById("randomBack");
  const animStyle = document.getElementById("animStyle");
  const animSpeed = document.getElementById("animSpeed");
  const gallery = document.getElementById("gallery");
  const loadingWrap = document.getElementById("loadingWrap");
  const loadingBar = document.getElementById("loadingBar");
  const loadingText = document.getElementById("loadingText");

  const TAU = Math.PI * 2;
  const ANIMATION_CLASSES = ["anim-wobble", "anim-bounce", "anim-pulse", "anim-drift"];
  const ANIMATION_TYPES = new Set(["wobble", "bounce", "pulse", "drift"]);

  let bgImage = null;
  let backgrounds = [];
  let activeBgIndex = -1;
  let randomColorHistory = [];
  let randomColorIndex = -1;

  const defaultBackgroundFiles = [
    "Background_02.png",
    "Background_03.png",
    "Background_04.png",
    "Background_05.png",
    "Background_06.png",
    "Background_07.png",
    "Background_08.png",
    "Background_09.png",
    "Background_10.png",
    "Background_11.png"
  ];

  function fitImage(targetCtx, img, w, h) {
    const scale = Math.max(w / img.width, h / img.height);
    const iw = img.width * scale;
    const ih = img.height * scale;
    targetCtx.drawImage(img, (w - iw) / 2, (h - ih) / 2, iw, ih);
  }

  function drawBackground(targetCtx) {
    targetCtx.fillStyle = bgcolor.value;
    targetCtx.fillRect(0, 0, canvas.width, canvas.height);

    if (bgImage) {
      fitImage(targetCtx, bgImage, canvas.width, canvas.height);
      targetCtx.fillStyle = "rgba(0,0,0,.18)";
      targetCtx.fillRect(0, 0, canvas.width, canvas.height);
    }
  }

  function wrapLines(targetCtx, str, maxWidth, fontSize, fontName) {
    targetCtx.font = `900 ${fontSize}px "${fontName}"`;
    const lines = [];
    for (const rawLine of str.toUpperCase().split("\n")) {
      const words = rawLine.split(/\s+/).filter(Boolean);
      let line = "";
      for (const word of words) {
        const test = line ? line + " " + word : word;
        if (targetCtx.measureText(test).width > maxWidth && line) {
          lines.push(line);
          line = word;
        } else {
          line = test;
        }
      }
      lines.push(line || "");
    }
    return lines;
  }

  function getAnimationType() {
    return ANIMATION_TYPES.has(animStyle.value) ? animStyle.value : "wobble";
  }

  function getAnimationDurationMs() {
    const speed = Number(animSpeed.value) || 100;
    return Math.round(1400 * (100 / Math.max(40, Math.min(200, speed))));
  }

  function applyAnimationStyle() {
    const animationType = getAnimationType();
    ANIMATION_CLASSES.forEach(cls => animText.classList.remove(cls));
    animText.classList.add(`anim-${animationType}`);
    animText.style.setProperty("--anim-duration", `${getAnimationDurationMs()}ms`);
  }

  function getAnimationState(animationType, progress) {
    const phase = progress * TAU;

    switch (animationType) {
      case "bounce":
        return {
          x: Math.sin(phase * 2) * 8,
          y: -22 * Math.abs(Math.sin(phase)),
          scale: 1 + Math.sin(phase) * 0.02,
          rotateDeg: Math.sin(phase) * 0.8,
          alpha: 1
        };
      case "pulse":
        return {
          x: 0,
          y: 0,
          scale: 1 + Math.sin(phase) * 0.07,
          rotateDeg: Math.sin(phase * 0.5) * 0.7,
          alpha: 1
        };
      case "drift":
        return {
          x: Math.sin(phase) * 12,
          y: Math.cos(phase * 0.9) * 8,
          scale: 1 + Math.sin(phase * 2) * 0.015,
          rotateDeg: Math.sin(phase) * 0.9,
          alpha: 0.94 + Math.sin(phase * 2) * 0.06
        };
      case "wobble":
      default:
        return {
          x: 0,
          y: 0,
          scale: 1 + Math.sin(phase + Math.PI / 2) * 0.015,
          rotateDeg: Math.sin(phase) * 1.2,
          alpha: 1
        };
    }
  }

  function drawStyledText(targetCtx, t, fontName, fontSize, animationState) {
    targetCtx.textAlign = "center";
    targetCtx.textBaseline = "middle";
    targetCtx.lineJoin = "round";
    targetCtx.lineCap = "round";

    const lines = wrapLines(targetCtx, t, canvas.width * 0.86, fontSize, fontName);
    const lineHeight = fontSize * 0.95;
    const totalHeight = (lines.length - 1) * lineHeight;
    const startY = -totalHeight / 2;

    targetCtx.font = `900 ${fontSize}px "${fontName}"`;
    targetCtx.save();
    targetCtx.translate(
      canvas.width / 2 + (animationState?.x || 0),
      canvas.height / 2 + (animationState?.y || 0)
    );
    targetCtx.rotate(((animationState?.rotateDeg || 0) * Math.PI) / 180);
    const scaleValue = animationState?.scale || 1;
    targetCtx.scale(scaleValue, scaleValue);
    targetCtx.globalAlpha = Math.max(0, Math.min(1, animationState?.alpha ?? 1));

    lines.forEach((line, i) => {
      targetCtx.save();
      targetCtx.translate(0, startY + i * lineHeight);
      targetCtx.rotate((i % 2 ? 1 : -1) * Math.PI / 180);

      targetCtx.shadowColor = shadow.value;
      targetCtx.shadowBlur = 0;
      targetCtx.shadowOffsetX = fontSize * 0.08;
      targetCtx.shadowOffsetY = fontSize * 0.09;

      targetCtx.strokeStyle = "#111";
      targetCtx.lineWidth = fontSize * 0.20;
      targetCtx.strokeText(line, 0, 0);

      targetCtx.strokeStyle = stroke.value;
      targetCtx.lineWidth = fontSize * 0.12;
      targetCtx.strokeText(line, 0, 0);

      targetCtx.fillStyle = fill.value;
      targetCtx.fillText(line, 0, 0);
      targetCtx.restore();
    });

    targetCtx.restore();
  }

  function drawStaticText(t, fontName, fontSize) {
    drawStyledText(ctx, t, fontName, fontSize, null);
  }

  function updateDownloadButtonLabel() {
    download.textContent = shell.classList.contains("showAnim") ? "Download APNG" : "Download PNG";
  }

  function buildAnimatedText(t, fontSize, fontName) {
    animText.textContent = (t || "").toUpperCase();
    animText.style.fontFamily = `"${fontName}"`;
    animText.style.fontSize = `${Math.max(22, (fontSize / 1920) * shell.clientWidth)}px`;
    animText.style.webkitTextStroke = `${Math.max(2, (fontSize / 1920) * shell.clientWidth * 0.055)}px ${stroke.value}`;
    animText.style.textShadow = `${Math.max(2, (fontSize / 1920) * shell.clientWidth * 0.06)}px ${Math.max(2, (fontSize / 1920) * shell.clientWidth * 0.07)}px 0 ${shadow.value}`;
    animText.style.color = fill.value;
    applyAnimationStyle();
  }
  window.buildAnimatedText = buildAnimatedText;

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBackground(ctx);

    const t = text.value || "A FEW MOMENTS LATER...";
    const fontName = font.value;
    const fontSize = Number(size.value);

    buildAnimatedText(t, fontSize, fontName);
    updateDownloadButtonLabel();

    if (!shell.classList.contains("showAnim")) {
      drawStaticText(t, fontName, fontSize);
    }
  }

  function triggerBlobDownload(blob, filename) {
    const link = document.createElement("a");
    const url = URL.createObjectURL(blob);
    link.href = url;
    link.download = filename;
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  async function downloadAPNG() {
    if (!window.UPNG || typeof window.UPNG.encode !== "function") {
      throw new Error("APNG encoder failed to load. Reload and try again.");
    }
    if (!window.pako || typeof window.pako.deflate !== "function") {
      throw new Error("Compression library failed to load. Reload and try again.");
    }

    const t = text.value || "A FEW MOMENTS LATER...";
    const fontName = font.value;
    const fontSize = Number(size.value);
    const animationType = getAnimationType();
    const durationMs = getAnimationDurationMs();
    const frameCount = 24;
    const frameDelay = Math.max(16, Math.round(durationMs / frameCount));

    const frameCanvas = document.createElement("canvas");
    frameCanvas.width = canvas.width;
    frameCanvas.height = canvas.height;
    const frameCtx = frameCanvas.getContext("2d", { willReadFrequently: true });
    const frames = [];
    const delays = [];

    for (let i = 0; i < frameCount; i++) {
      const progress = i / frameCount;
      const animationState = getAnimationState(animationType, progress);
      frameCtx.clearRect(0, 0, frameCanvas.width, frameCanvas.height);
      drawBackground(frameCtx);
      drawStyledText(frameCtx, t, fontName, fontSize, animationState);
      const imageData = frameCtx.getImageData(0, 0, frameCanvas.width, frameCanvas.height);
      frames.push(imageData.data.buffer.slice(0));
      delays.push(frameDelay);
    }

    const apngData = window.UPNG.encode(frames, frameCanvas.width, frameCanvas.height, 0, delays);
    const apngBlob = new Blob([apngData], { type: "image/png" });
    triggerBlobDownload(apngBlob, "time-card.apng");
  }

  async function downloadImage() {
    await document.fonts.ready;
    render();
    if (shell.classList.contains("showAnim")) {
      await downloadAPNG();
      return;
    }

    const pngBlob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
    triggerBlobDownload(pngBlob, "time-card.png");
  }

  function scheduleHideLoading() {
    setTimeout(() => {
      if (backgrounds.length) loadingWrap.style.display = "none";
    }, 650);
  }

  function updateLoadingUI(loaded, total, kind) {
    loadingBar.style.width = `${Math.round((loaded / total) * 100)}%`;
    loadingText.textContent = `Loading ${loaded} / ${total} ${kind}...`;
  }

  function updateReadyMessage(total, failed, kind) {
    loadingText.textContent = `${total - failed} ${kind} ready${failed ? `, ${failed} failed` : ""}.`;
  }

  function updateGallery() {
    gallery.innerHTML = "";
    backgrounds.forEach((item, index) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "thumb" + (index === activeBgIndex ? " active" : "");
      btn.title = item.name;
      btn.innerHTML = `<img src="${item.url}" alt=""><span>${index + 1}</span>`;
      btn.addEventListener("click", () => {
        activeBgIndex = index;
        bgImage = item.img;
        updateGallery();
        render();
      });
      gallery.appendChild(btn);
    });
  }

  function loadImage(url, timeoutMs = 8000) {
    return new Promise(resolve => {
      const img = new Image();
      let settled = false;

      const done = ok => {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        resolve(ok && img.naturalWidth ? img : null);
      };

      const timer = setTimeout(() => done(false), timeoutMs);
      img.onload = () => done(true);
      img.onerror = () => done(false);
      img.src = url;
    });
  }

  async function loadFiles(files) {
    const imageFiles = [...files].filter(f => f.type && f.type.startsWith("image/"));
    if (!imageFiles.length) return;

    loadingWrap.style.display = "block";
    loadingBar.style.width = "0%";
    loadingText.textContent = `Loading 0 / ${imageFiles.length} dropped backgrounds...`;

    let loaded = 0;
    let failed = 0;

    for (const f of imageFiles) {
      const url = URL.createObjectURL(f);
      const img = await loadImage(url);

      if (img) {
        backgrounds.push({ name: f.name, url, img });
        activeBgIndex = backgrounds.length - 1;
        bgImage = img;
      } else {
        URL.revokeObjectURL(url);
        failed++;
      }

      loaded++;
      updateLoadingUI(loaded, imageFiles.length, "dropped backgrounds");
      updateGallery();
      render();
    }

    updateReadyMessage(imageFiles.length, failed, "dropped backgrounds");
    scheduleHideLoading();
  }

  async function loadDefaultBackgrounds() {
    loadingWrap.style.display = "block";
    loadingBar.style.width = "0%";
    loadingText.textContent = `Loading 0 / ${defaultBackgroundFiles.length} backgrounds...`;

    let completed = 0;
    let failed = 0;

    for (const name of defaultBackgroundFiles) {
      const url = new URL(`backgrounds/${name}`, window.location.href).href;
      const img = await loadImage(url);

      completed++;
      updateLoadingUI(completed, defaultBackgroundFiles.length, "backgrounds");

      if (img) {
        backgrounds.push({ name, url, img });

        if (activeBgIndex === -1) {
          activeBgIndex = 0;
          bgImage = img;
          render();
        }
      } else {
        failed++;
      }

      updateGallery();
      render();
    }

    if (backgrounds.length) {
      if (activeBgIndex < 0) activeBgIndex = 0;
      bgImage = backgrounds[activeBgIndex].img;
      updateReadyMessage(defaultBackgroundFiles.length, failed, "backgrounds");
    } else {
      console.error("No default backgrounds loaded", defaultBackgroundFiles);
      loadingText.textContent = "No backgrounds loaded. Check that /backgrounds is next to index.html.";
      loadingWrap.style.display = "block";
      render();
      return;
    }

    updateGallery();
    render();
    scheduleHideLoading();
  }

  function randColor() {
    return "#" + Math.floor(Math.random() * 16777215).toString(16).padStart(6, "0");
  }

  function getCurrentColorSet() {
    return {
      fill: fill.value,
      stroke: stroke.value,
      shadow: shadow.value
    };
  }

  function applyColorSet(set) {
    if (!set) return;
    fill.value = set.fill;
    stroke.value = set.stroke;
    shadow.value = set.shadow;
    render();
  }

  function updateRandomButtons() {
    randomBack.disabled = randomColorIndex <= 0;
  }

  function nextRandomColors() {
    if (randomColorIndex >= 0 && randomColorIndex < randomColorHistory.length - 1) {
      randomColorIndex += 1;
      applyColorSet(randomColorHistory[randomColorIndex]);
      updateRandomButtons();
      return;
    }

    const nextSet = {
      fill: randColor(),
      stroke: randColor(),
      shadow: randColor()
    };

    randomColorHistory = randomColorHistory.slice(0, randomColorIndex + 1);
    randomColorHistory.push(nextSet);
    randomColorIndex = randomColorHistory.length - 1;
    applyColorSet(nextSet);
    updateRandomButtons();
  }

  function backRandomColors() {
    if (randomColorIndex <= 0) return;
    randomColorIndex -= 1;
    applyColorSet(randomColorHistory[randomColorIndex]);
    updateRandomButtons();
  }

  drop.addEventListener("click", () => file.click());
  file.addEventListener("change", e => loadFiles(e.target.files));

  ["dragenter", "dragover"].forEach(ev => {
    drop.addEventListener(ev, e => {
      e.preventDefault();
      drop.classList.add("drag");
    });
  });

  ["dragleave", "drop"].forEach(ev => {
    drop.addEventListener(ev, e => {
      e.preventDefault();
      drop.classList.remove("drag");
    });
  });

  drop.addEventListener("drop", e => loadFiles(e.dataTransfer.files));

  document.querySelectorAll("input, textarea, select").forEach(el => {
    el.addEventListener("input", render);
    el.addEventListener("change", render);
  });

  randomBack.addEventListener("click", backRandomColors);
  randomNext.addEventListener("click", nextRandomColors);

  reset.addEventListener("click", () => {
    bgImage = null;
    activeBgIndex = -1;
    updateGallery();
    render();
  });

  toggleAnim.addEventListener("click", () => {
    shell.classList.toggle("showAnim");
    render();
  });

  download.addEventListener("click", async () => {
    const previousLabel = download.textContent;
    download.disabled = true;
    download.textContent = "Rendering...";

    try {
      await downloadImage();
    } catch (error) {
      const message = error && error.message ? error.message : String(error);
      loadingText.textContent = `Download failed: ${message}`;
      console.error(error);
    } finally {
      download.disabled = false;
      download.textContent = previousLabel;
      updateDownloadButtonLabel();
    }
  });

  window.addEventListener("resize", render);

  document.fonts.ready.then(() => {
    randomColorHistory = [getCurrentColorSet()];
    randomColorIndex = 0;
    updateRandomButtons();
    render();
    updateDownloadButtonLabel();
  });
  loadDefaultBackgrounds();
})();
</script>
</body>
</html>
